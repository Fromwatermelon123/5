<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>服飾商品 Dashboard</title><style>
:root{--bg:#faf8f5;--card:#fff;--tx:#2b2622;--mut:#7a7068;--ac:#b5546b;--bd:#e8e2da}
@media(prefers-color-scheme:dark){:root{--bg:#1c1a19;--card:#272422;--tx:#f1ece6;--mut:#a79d93;--ac:#e08aa0;--bd:#3a3532}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans TC",sans-serif;padding:20px;max-width:1200px;margin:auto}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px}.kpi b{display:block;font-size:20px}.kpi span{color:var(--mut);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.bar input,.bar select{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .im{aspect-ratio:1/1;overflow:hidden;background:#eee}.card img{width:100%;height:128%;object-fit:cover;object-position:top;display:block}
.card .bd{padding:10px 12px}.nm{font-weight:600}.mt{color:var(--mut);font-size:12.5px}.pr{color:var(--ac);font-weight:700;font-size:17px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);margin-right:4px}.low{color:#c0392b;border-color:#c0392b}
</style></head><body>
<h1>服飾商品 Dashboard</h1><div class="sub" id="src">載入中…</div>
<div class="kpi" id="kpi"></div>
<div class="bar"><input id="q" placeholder="搜尋商品名稱 / 品牌 / 顏色"><select id="cat"><option value="">全部分類</option></select>
<select id="sort"><option value="id">編號</option><option value="pa">價格 低→高</option><option value="pd">價格 高→低</option><option value="st">庫存 少→多</option></select></div>
<div class="grid" id="grid"></div>
<script>
// 串接 API：填入 TiDB Cloud Data Service 的 GET 端點即可（回傳需含 data 陣列或純陣列，欄位同 products.json）；留空則使用 data/products.json
const API_URL="https://5-rose-kappa.vercel.app/api/products";
let P=[];
const $=id=>document.getElementById(id);
async function load(){
  try{ if(API_URL){const r=await fetch(API_URL);if(!r.ok)throw 0;const j=await r.json();P=Array.isArray(j)?j:(j.data?.rows||j.data||[]);if(!P.length)throw 0;$("src").textContent="資料來源：MySQL 資料庫（Aiven），透過 Vercel API 即時讀取";}
  else throw 0; }catch(e){ const r=await fetch("data/products.json");P=await r.json();$("src").textContent="資料來源：data/products.json（由 MySQL clothing 資料表匯出）"; }
  [...new Set(P.map(p=>p.category))].forEach(c=>$("cat").add(new Option(c,c)));render();
}
function render(){
  const k=$("q").value.trim().toLowerCase(),c=$("cat").value;
  let L=P.filter(p=>(!c||p.category==c)&&(!k||[p.product_name,p.brand,p.color].join(" ").toLowerCase().includes(k)));
  const s=$("sort").value; L.sort((a,b)=>s=="pa"?a.price-b.price:s=="pd"?b.price-a.price:s=="st"?a.stock_qty-b.stock_qty:a.product_id.localeCompare(b.product_id));
  $("kpi").innerHTML=`<div><b>${L.length}</b><span>商品數</span></div><div><b>$${Math.round(L.reduce((t,p)=>t+p.price,0)/(L.length||1)).toLocaleString()}</b><span>平均價格</span></div><div><b>${L.reduce((t,p)=>t+p.stock_qty,0)}</b><span>總庫存</span></div><div><b>${L.filter(p=>p.stock_qty<=5).length}</b><span>低庫存(≤5)</span></div>`;
  $("grid").innerHTML=L.map(p=>`<div class="card"><div class="im"><img loading="lazy" src="${p.image_url}" alt="${p.product_name}"></div><div class="bd"><div class="nm">${p.product_name}</div>
  <div class="mt">${p.brand} · ${p.color} · ${p.size}</div><div class="pr">$${Number(p.price).toLocaleString()}</div>
  <div style="margin-top:4px"><span class="tag">${p.category}</span><span class="tag ${p.stock_qty<=5?"low":""}">${p.stock_qty==0?"缺貨":"庫存 "+p.stock_qty}</span></div></div></div>`).join("");
}
["q","cat","sort"].forEach(i=>$(i).addEventListener("input",render));load();
</script></body></html>
